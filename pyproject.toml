[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-similaridade"
version = "0.1.0"
description = "Scanner desktop de similaridade visual para rostos e objetos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.setuptools.package-data]
"scanner.gui" = ["recursos/*.png", "recursos/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "modelos: testes que precisam dos pesos baixados por `python -m scanner preparar`",
]
